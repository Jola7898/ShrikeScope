; ShrikeScope - a small oscilloscope on the Vicharak Shrike-Fi
; The display settings are in display.ini so they can be reused elsewhere.

[platformio]
extra_configs = display.ini

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1      ; the Shrike-Fi has an ESP32-S3FN8 (8MB flash, no PSRAM)
framework = arduino
monitor_speed = 115200

lib_deps =
    ${tft.lib_deps}

build_flags =
    ; serial over the board's USB port
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    ${tft.build_flags}
