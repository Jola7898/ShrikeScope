; TFT_eSPI setup for the 2.4" ST7789 (240x320) on the Shrike-Fi.
; Copied over from ShrikeTFT. Doing it with build flags means I never have to
; touch the library's User_Setup.h.

[tft]
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

build_flags =
    -D USER_SETUP_LOADED=1
    -D DISABLE_ALL_LIBRARY_WARNINGS=1   ; no touch panel, stops the TOUCH_CS warning

    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_INVERSION_OFF=1      ; my panel comes out inverted without this
    ; -D TFT_RGB_ORDER=TFT_BGR  ; try this if red and blue are swapped

    ; Needed on the S3 with core 2.0.x, otherwise nothing reaches the screen
    -D USE_FSPI_PORT=1

    ; IO33-38 are the S3's native SPI pins on the right header.
    ; Stay away from GPIO8-13, the FPGA uses those.
    -D TFT_MISO=37
    -D TFT_MOSI=35
    -D TFT_SCLK=36
    -D TFT_CS=34
    -D TFT_DC=33
    -D TFT_RST=38
    -D TFT_BL=18
    -D TFT_BACKLIGHT_ON=HIGH

    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT=1

    -D SPI_FREQUENCY=40000000   ; drop to 27000000 if you see glitches
    -D SPI_READ_FREQUENCY=20000000
